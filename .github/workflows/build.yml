# Builds the module zip.
#  - pull request / manual run: build only, the zip is kept as a workflow artifact
#  - published release: build, attach the zip to the release, update update.json on main
name: Build module

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          ./build.sh
          version=$(sed -n 's/^version=//p' module/module.prop)
          code=$(sed -n 's/^versionCode=//p' module/module.prop)
          zip="dist/force-skiavk-$version.zip"
          test -f "$zip"
          unzip -l "$zip"
          { echo "VERSION=$version"; echo "VERSION_CODE=$code"; echo "ZIP=$zip"; } >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ env.ZIP }}

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match version=$VERSION in module/module.prop"
            exit 1
          fi
          gh release upload "$TAG" "$ZIP" --clobber

      - name: Update update.json on main
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cat > update.json <<JSON
          {
            "version": "$VERSION",
            "versionCode": $VERSION_CODE,
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/$TAG/force-skiavk-$VERSION.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || git commit -m "update.json: $VERSION"
          git push origin main
